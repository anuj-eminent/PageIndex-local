<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Document Upload</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .admin-container {
            max-width: 600px;
            margin: 4rem auto;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 2rem;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            box-shadow: var(--glass-shadow);
            text-align: center;
        }
        .file-upload-wrapper {
            margin: 2rem 0;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            align-items: center;
        }
        .file-input-label {
            background: var(--surface-color);
            border: 2px dashed var(--accent-primary);
            padding: 2rem;
            border-radius: 12px;
            cursor: pointer;
            width: 100%;
            transition: all 0.3s;
        }
        .file-input-label:hover {
            background: var(--surface-light);
        }
        #pdf-file {
            display: none;
        }
        .upload-btn {
            background: var(--accent-primary);
            color: white;
            border: none;
            padding: 0.75rem 2rem;
            font-size: 1rem;
            border-radius: 30px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            font-weight: 500;
        }
        .upload-btn:hover {
            background: var(--accent-hover);
        }
        .upload-btn:active {
            transform: scale(0.95);
        }
        .upload-btn:disabled {
            background: var(--surface-light);
            cursor: not-allowed;
            transform: none;
        }
        .timer-display {
            font-size: 4rem;
            font-weight: 600;
            color: var(--model-3); /* Blue */
            margin: 2rem 0;
            font-variant-numeric: tabular-nums;
            text-shadow: 0 0 20px rgba(59, 130, 246, 0.4);
        }
        .result-message {
            font-size: 2rem;
            font-weight: 600;
            margin-top: 1rem;
            min-height: 3rem;
        }
        .result-message.success {
            color: var(--model-1); /* Emerald */
            text-shadow: 0 0 10px rgba(16, 185, 129, 0.4);
        }
        .result-message.error {
            color: var(--model-2); /* Rose */
            font-size: 1.25rem;
        }
        .status-area {
            display: none;
            animation: fadeIn 0.5s ease-out;
        }
        .nav-links {
            margin-top: 2rem;
            font-size: 0.9rem;
        }
        .nav-links a {
            color: var(--text-secondary);
            text-decoration: none;
            transition: color 0.2s;
        }
        .nav-links a:hover {
            color: var(--accent-primary);
        }
    </style>
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <div class="logo">
                <i class="fa-solid fa-shield-halved"></i>
                <h1>Model<span>Admin</span></h1>
            </div>
            <p class="subtitle">Upload documents for background processing</p>
        </header>

        <main class="admin-container">
            <h2>Upload PDF Document</h2>
            <form id="upload-form">
                <div class="file-upload-wrapper">
                    <label class="file-input-label" for="pdf-file">
                        <i class="fa-solid fa-cloud-arrow-up" style="font-size: 3rem; margin-bottom: 1rem; color: var(--accent-primary);"></i>
                        <div id="file-name-display" style="font-size: 1.1rem;">Click to select a PDF file</div>
                    </label>
                    <input type="file" id="pdf-file" accept="application/pdf" required>
                    <button type="submit" class="upload-btn" id="upload-btn">Upload & Process</button>
                </div>
            </form>

            <div class="status-area" id="status-area">
                <div class="timer-display" id="timer">10:00</div>
                <div class="result-message" id="result-message">Processing...</div>
                <div class="spinner" id="processing-spinner" style="margin: 1rem auto; width: 40px; height: 40px; border-width: 4px;"></div>
            </div>
            
            <div class="nav-links">
                <a href="index.html"><i class="fa-solid fa-arrow-left"></i> Back to Chat</a>
            </div>
        </main>
    </div>

    <script src="admin.js"></script>
</body>
</html>
